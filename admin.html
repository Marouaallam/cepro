<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>CEPRO — Demandes reçues</title>
  <link rel="icon" type="image/png" href="assets/cepro-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- Login -->
  <main id="loginView" class="login" hidden>
    <form id="loginForm" class="login__card" novalidate>
      <img src="assets/cepro-logo.png" alt="CEPRO Immobilier" width="80" height="84">
      <h1>Espace administrateur</h1>
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="loginError" class="error" role="alert" hidden></p>
      <button type="submit" class="btn btn--primary" id="loginBtn">Se connecter</button>
    </form>
  </main>

  <!-- Configuration error -->
  <main id="configView" class="login" hidden>
    <div class="login__card">
      <h1>Configuration incomplète</h1>
      <p>Variables d'environnement manquantes sur Vercel :</p>
      <ul id="missingVars" class="missing"></ul>
    </div>
  </main>

  <!-- Dashboard -->
  <div id="dashView" hidden>
    <header class="topbar">
      <div class="topbar__brand">
        <img src="assets/cepro-logo.png" alt="" width="34" height="36">
        <span>Demandes reçues</span>
      </div>
      <div class="topbar__actions">
        <button type="button" class="btn" id="exportBtn">Exporter</button>
        <button type="button" class="btn btn--ghost" id="logoutBtn">Déconnexion</button>
      </div>
    </header>

    <main class="dash">
      <p class="summary" id="summary" aria-live="polite"></p>

      <form id="filters" class="filters" autocomplete="off">
        <input type="search" name="q" placeholder="Rechercher un nom ou un téléphone" aria-label="Recherche">
        <select name="residence" aria-label="Résidence">
          <option value="">Toutes les résidences</option>
          <option value="prestige">Prestige</option>
          <option value="signature">Signature</option>
        </select>
      </form>

      <p id="dashError" class="error error--block" role="alert" hidden></p>

      <div class="table-wrap">
        <table class="leads">
          <thead>
            <tr>
              <th>Date</th>
              <th>Nom</th>
              <th>Téléphone</th>
              <th>Logement</th>
              <th>À appeler</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <p id="empty" class="empty" hidden>Aucune demande ne correspond à ces critères.</p>
      </div>

      <nav class="pager" aria-label="Pagination">
        <button type="button" class="btn" id="prevBtn">← Précédent</button>
        <span id="pageInfo"></span>
        <button type="button" class="btn" id="nextBtn">Suivant →</button>
      </nav>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
